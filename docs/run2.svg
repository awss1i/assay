<svg xmlns="http://www.w3.org/2000/svg" width="772" height="696"
     viewBox="0 0 772 696" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
     font-size="15">
  <style>
  .play{animation:fade 8.23s linear infinite}
  .row{animation:8.23s step-end infinite}
  .keys{transform:translateX(109.2px);animation:type 8.23s infinite}
  .cursor{opacity:0;animation:cursor 8.23s step-end infinite}
  @keyframes fade{0%,92.10%{opacity:1}100%{opacity:0}}
  @keyframes type{0%{transform:translateX(0)}
    3.65%{transform:translateX(0);animation-timing-function:steps(12,end)}
    12.39%,100%{transform:translateX(109.2px)}}
  @keyframes cursor{0%{opacity:1}24.54%,100%{opacity:0}}
  @keyframes r0{0%{opacity:0}24.54%,100%{opacity:1}}
  @keyframes r1{0%{opacity:0}26.49%,100%{opacity:1}}
  @keyframes r2{0%{opacity:0}28.43%,100%{opacity:1}}
  @keyframes r3{0%{opacity:0}30.38%,100%{opacity:1}}
  @keyframes r4{0%{opacity:0}32.32%,100%{opacity:1}}
  @keyframes r5{0%{opacity:0}34.26%,100%{opacity:1}}
  @keyframes r6{0%{opacity:0}36.21%,100%{opacity:1}}
  @keyframes r7{0%{opacity:0}38.15%,100%{opacity:1}}
  @keyframes r8{0%{opacity:0}40.10%,100%{opacity:1}}
  @keyframes r9{0%{opacity:0}42.04%,100%{opacity:1}}
  @keyframes r10{0%{opacity:0}43.99%,100%{opacity:1}}
  @keyframes r11{0%{opacity:0}45.93%,100%{opacity:1}}
  @keyframes r12{0%{opacity:0}47.87%,100%{opacity:1}}
  @keyframes r13{0%{opacity:0}49.82%,100%{opacity:1}}
  @keyframes r14{0%{opacity:0}51.76%,100%{opacity:1}}
  @keyframes r15{0%{opacity:0}53.71%,100%{opacity:1}}
  @keyframes r16{0%{opacity:0}55.65%,100%{opacity:1}}
  @keyframes r17{0%{opacity:0}57.59%,100%{opacity:1}}
  @keyframes r18{0%{opacity:0}59.54%,100%{opacity:1}}
  @keyframes r19{0%{opacity:0}61.48%,100%{opacity:1}}
  @keyframes r20{0%{opacity:0}63.43%,100%{opacity:1}}
  @keyframes r21{0%{opacity:0}65.37%,100%{opacity:1}}
  @keyframes r22{0%{opacity:0}67.31%,100%{opacity:1}}
  @keyframes r23{0%{opacity:0}69.26%,100%{opacity:1}}
  @keyframes r24{0%{opacity:0}71.20%,100%{opacity:1}}
  @keyframes r25{0%{opacity:0}73.15%,100%{opacity:1}}
  @keyframes r26{0%{opacity:0}75.09%,100%{opacity:1}}
