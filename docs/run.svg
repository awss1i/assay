    <text class="row" style="animation-name:r12" x="22" y="301" xml:space="preserve"><tspan fill="#6d7385">C009</tspan> <tspan fill="#ef6b73">[FAILED]</tspan> <tspan fill="#eef0f5">click medium twice</tspan></text>
    <text class="row" style="animation-name:r13" x="22" y="318" xml:space="preserve"><tspan fill="#e2c15f">    ↳ same finding as C003</tspan></text>
