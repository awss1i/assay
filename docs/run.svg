<svg xmlns="http://www.w3.org/2000/svg" width="945" height="586"
     viewBox="0 0 945 586" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
     font-size="13">
  <rect width="945" height="586" rx="10" fill="#12131a"/>
  <circle cx="24" cy="22" r="6" fill="#ef6b73"/>
  <circle cx="44" cy="22" r="6" fill="#e2c15f"/>
  <circle cx="64" cy="22" r="6" fill="#5ac37d"/>
  <g fill="#c6cad6">
    <text x="22" y="46" xml:space="preserve"><tspan fill="#5ac37d">$</tspan> <tspan fill="#eef0f5">assay ./paint</tspan></text>
    <text x="22" y="80" xml:space="preserve"><tspan fill="#eef0f5">25 case(s) planned, 25 carried out, 23 passed, 2 failed</tspan></text>
    <text x="22" y="114" xml:space="preserve"><tspan fill="#6d7385">C001</tspan> <tspan fill="#5ac37d">[ok]</tspan> <tspan fill="#6d7385">open the page and let it settle</tspan></text>
    <text x="22" y="131" xml:space="preserve"><tspan fill="#6d7385">C002</tspan> <tspan fill="#5ac37d">[ok]</tspan> <tspan fill="#6d7385">press Eraser</tspan></text>
    <text x="22" y="148" xml:space="preserve"><tspan fill="#6d7385">C003</tspan> <tspan fill="#5ac37d">[ok]</tspan> <tspan fill="#6d7385">press Eraser twice</tspan></text>
    <text x="22" y="165" xml:space="preserve"><tspan fill="#6d7385">C004</tspan> <tspan fill="#5ac37d">[ok]</tspan> <tspan fill="#6d7385">press Fill</tspan></text>
    <text x="22" y="182" xml:space="preserve"><tspan fill="#6d7385">C005</tspan> <tspan fill="#5ac37d">[ok]</tspan> <tspan fill="#6d7385">press Fill twice</tspan></text>
    <text x="22" y="199" xml:space="preserve"><tspan fill="#6d7385">C006</tspan> <tspan fill="#5ac37d">[ok]</tspan> <tspan fill="#6d7385">press Undo</tspan></text>
    <text x="22" y="216" xml:space="preserve"><tspan fill="#6d7385">C007</tspan> <tspan fill="#5ac37d">[ok]</tspan> <tspan fill="#6d7385">press Undo twice</tspan></text>
    <text x="22" y="233" xml:space="preserve"><tspan fill="#6d7385">C008</tspan> <tspan fill="#5ac37d">[ok]</tspan> <tspan fill="#6d7385">press Download PNG</tspan></text>
    <text x="22" y="250" xml:space="preserve"><tspan fill="#6d7385">C009</tspan> <tspan fill="#5ac37d">[ok]</tspan> <tspan fill="#6d7385">press Download PNG twice</tspan></text>
    <text x="22" y="267" xml:space="preserve"><tspan fill="#6d7385">C010</tspan> <tspan fill="#5ac37d">[ok]</tspan> <tspan fill="#6d7385">click canvas at point 1</tspan></text>
    <text x="22" y="284" xml:space="preserve"><tspan fill="#6d7385">C011</tspan> <tspan fill="#5ac37d">[ok]</tspan> <tspan fill="#6d7385">click canvas at point 2</tspan></text>
    <text x="22" y="301" xml:space="preserve"><tspan fill="#6d7385">C012</tspan> <tspan fill="#5ac37d">[ok]</tspan> <tspan fill="#6d7385">click canvas at point 3</tspan></text>
    <text x="22" y="318" xml:space="preserve"><tspan fill="#6d7385">C013</tspan> <tspan fill="#5ac37d">[ok]</tspan> <tspan fill="#6d7385">click canvas at point 4</tspan></text>
    <text x="22" y="335" xml:space="preserve"><tspan fill="#6d7385">C014</tspan> <tspan fill="#5ac37d">[ok]</tspan> <tspan fill="#6d7385">use canvas: click it, drag on it, and press the keys a program like this is driven with</tspan></text>
    <text x="22" y="352" xml:space="preserve"><tspan fill="#6d7385">C015</tspan> <tspan fill="#ef6b73">[FAILED]</tspan> <tspan fill="#eef0f5">draw on canvas, then draw somewhere else on it</tspan></text>
    <text x="22" y="369" xml:space="preserve"><tspan fill="#ef6b73">    → the first stroke drew and the second did nothing. this surface has forgotten how to draw</tspan></text>
    <text x="22" y="386" xml:space="preserve"><tspan fill="#6d7385">C016</tspan> <tspan fill="#5ac37d">[ok]</tspan> <tspan fill="#6d7385">draw on canvas twice, then press Eraser twice</tspan></text>
    <text x="22" y="403" xml:space="preserve"><tspan fill="#6d7385">C017</tspan> <tspan fill="#5ac37d">[ok]</tspan> <tspan fill="#6d7385">draw on canvas twice, then press Fill twice</tspan></text>
    <text x="22" y="420" xml:space="preserve"><tspan fill="#6d7385">C018</tspan> <tspan fill="#ef6b73">[FAILED]</tspan> <tspan fill="#eef0f5">draw on canvas twice, then press Undo twice</tspan></text>
    <text x="22" y="437" xml:space="preserve"><tspan fill="#ef6b73">    → the first press did nothing and the second did something, from the same state, so this control is one behind</tspan></text>
    <text x="22" y="454" xml:space="preserve"><tspan fill="#6d7385">C019</tspan> <tspan fill="#5ac37d">[ok]</tspan> <tspan fill="#6d7385">draw on canvas twice, then press Download PNG twice</tspan></text>
    <text x="22" y="471" xml:space="preserve"><tspan fill="#6d7385">C020</tspan> <tspan fill="#5ac37d">[ok]</tspan> <tspan fill="#6d7385">press Eraser, then Fill</tspan></text>
    <text x="22" y="488" xml:space="preserve"><tspan fill="#6d7385">C021</tspan> <tspan fill="#5ac37d">[ok]</tspan> <tspan fill="#6d7385">press Eraser, then Undo</tspan></text>
    <text x="22" y="505" xml:space="preserve"><tspan fill="#6d7385">C022</tspan> <tspan fill="#5ac37d">[ok]</tspan> <tspan fill="#6d7385">press Fill, then Eraser</tspan></text>
    <text x="22" y="522" xml:space="preserve"><tspan fill="#6d7385">C023</tspan> <tspan fill="#5ac37d">[ok]</tspan> <tspan fill="#6d7385">press Fill, then Undo</tspan></text>
    <text x="22" y="539" xml:space="preserve"><tspan fill="#6d7385">C024</tspan> <tspan fill="#5ac37d">[ok]</tspan> <tspan fill="#6d7385">press Undo, then Eraser</tspan></text>
    <text x="22" y="556" xml:space="preserve"><tspan fill="#6d7385">C025</tspan> <tspan fill="#5ac37d">[ok]</tspan> <tspan fill="#6d7385">press Undo, then Fill</tspan></text>
  </g>
</svg>
