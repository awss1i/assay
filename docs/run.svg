    <text class="row" style="animation-name:r2" x="22" y="131" xml:space="preserve"><tspan fill="#6d7385">C002</tspan> <tspan fill="#5ac37d">[ok]</tspan> <tspan fill="#6d7385">click blue</tspan></text>
