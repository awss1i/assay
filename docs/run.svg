    <text class="row" style="animation-name:r9" x="22" y="250" xml:space="preserve"><tspan fill="#6d7385">C007</tspan> <tspan fill="#ef6b73">[FAILED]</tspan> <tspan fill="#eef0f5">click large twice</tspan></text>
    <text class="row" style="animation-name:r10" x="22" y="267" xml:space="preserve"><tspan fill="#e2c15f">    ↳ same finding as C003</tspan></text>
