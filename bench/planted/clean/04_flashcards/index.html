<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flashcard Deck</title>
<style>
  body {font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin:0; height:100vh; background:#f0f0f0;}
  #card {width:300px; height:200px; perspective:1000px; margin:20px;}
  .inner {position:relative; width:100%; height:100%; text-align:center; transition:transform 0.6s; transform-style:preserve-3d; cursor:pointer;}
  .inner.flipped {transform: rotateY(180deg);}
  .face {position:absolute; width:100%; height:100%; backface-visibility:hidden; display:flex; align-items:center; justify-content:center; border:2px solid #333; border-radius:8px; background:#fff; box-shadow:0 4px 6px rgba(0,0,0,0.1);}
  .back {transform:rotateY(180deg);}
  #controls {margin-top:10px;}
  button {margin:0 5px; padding:5px 10px;}
</style>
</head>
<body>
<div id="card"><div class="inner" id="inner">
  <div class="face front" id="front"></div>
  <div class="face back" id="back"></div>
</div></div>
<div id="controls">
  <button id="prev">Previous</button>
  <button id="next">Next</button>
  <button id="shuffle">Shuffle</button>
</div>
<script>
(function(){
  const cards = [
    {q:"What is the capital of France?", a:"Paris"},
    {q:"2 + 2 = ?", a:"4"},
    {q:"Largest planet?", a:"Jupiter"},
    {q:"HTML stands for?", a:"HyperText Markup Language"},
    {q:"First element of periodic table?", a:"Hydrogen"},
    {q:"Speed of light (m/s)?", a:"299,792,458"}
  ];
  let order = cards.map((_,i)=>i);
  let index = 0;
  const frontEl=document.getElementById('front');
  const backEl=document.getElementById('back');
  const innerEl=document.getElementById('inner');
  function render(){
    const card = cards[order[index]];
    frontEl.textContent = card.q;
    backEl.textContent = card.a;
    innerEl.classList.remove('flipped');
  }
  innerEl.addEventListener('click',()=>{innerEl.classList.toggle('flipped');});
  document.getElementById('next').addEventListener('click',()=>{
    if(index < order.length-1){index++; render();}
  });
  document.getElementById('prev').addEventListener('click',()=>{
    if(index>0){index--; render();}
  });
  document.getElementById('shuffle').addEventListener('click',()=>{
    for(let i=order.length-1;i>0;i--){
      const j=Math.floor(Math.random()* (i+1));
      [order[i],order[j]]=[order[j],order[i]];
    }
    index=0; render();
  });
  render();
})();
</script>
</body>
</html>
