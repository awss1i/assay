<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stock Table</title>
<style>
  body {font-family: Arial, sans-serif; margin: 20px;}
  table {border-collapse: collapse; width: 100%; max-width: 600px;}
  th, td {border: 1px solid #ccc; padding: 8px; text-align: center;}
  th {background: #f0f0f0;}
  .low-stock {color: red; font-weight: bold;}
  button {padding: 4px 8px;}
  .total {margin-top: 20px; font-size: 1.2em;}
</style>
</head>
<body>
<h2>Inventory</h2>
<table id="stock-table">
  <thead>
    <tr>
      <th>Item</th>
      <th>Quantity</th>
      <th>Actions</th>
      <th>Note</th>
    </tr>
  </thead>
  <tbody>
    <!-- Rows will be generated by script -->
  </tbody>
</table>
<div class="total">Total units: <span id="total-count">0</span></div>

<script>
// Define initial stock items
const items = [
  {name: "Apples", qty: 0},
  {name: "Bananas", qty: 0},
  {name: "Oranges", qty: 0},
];

const tableBody = document.querySelector('#stock-table tbody');
const totalSpan = document.getElementById('total-count');

function renderTable() {
  tableBody.innerHTML = '';
  items.forEach((item, index) => {
    const tr = document.createElement('tr');
    // Item name
    const tdName = document.createElement('td');
    tdName.textContent = item.name;
    tr.appendChild(tdName);
    // Quantity display
    const tdQty = document.createElement('td');
    tdQty.id = `qty-${index}`;
    tdQty.textContent = item.qty;
    tr.appendChild(tdQty);
    // Buttons
    const tdActions = document.createElement('td');
    const btnMinus = document.createElement('button');
    btnMinus.textContent = '-';
    btnMinus.addEventListener('click', () => changeQty(index, -1));
    const btnPlus = document.createElement('button');
    btnPlus.textContent = '+';
    btnPlus.addEventListener('click', () => changeQty(index, 1));
    tdActions.appendChild(btnMinus);
    tdActions.appendChild(btnPlus);
    tr.appendChild(tdActions);
    // Note for low stock
    const tdNote = document.createElement('td');
    tdNote.id = `note-${index}`;
    if (item.qty < 3) {
      tdNote.textContent = 'Low stock';
      tdNote.classList.add('low-stock');
    }
    tr.appendChild(tdNote);
    tableBody.appendChild(tr);
  });
  updateTotal();
}

function changeQty(idx, delta) {
  const newQty = items[idx].qty + delta;
  if (newQty < 0) return; // prevent negative
  items[idx].qty = newQty;
  document.getElementById(`qty-${idx}`).textContent = newQty;
  const noteEl = document.getElementById(`note-${idx}`);
  if (newQty < 3) {
    noteEl.textContent = 'Low stock';
    noteEl.classList.add('low-stock');
  } else {
    noteEl.textContent = '';
    noteEl.classList.remove('low-stock');
  }
  updateTotal();
}

function updateTotal() {
  const total = items.reduce((sum, it) => sum + it.qty, 0);
  totalSpan.textContent = total;
}

// Initial render
renderTable();
</script>
</body>
</html>
