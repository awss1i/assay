<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
  body {margin:0; background:#000; color:#fff; font-family:sans-serif; display:flex; flex-direction:column; align-items:center;}
  #gameCanvas {background:#111; display:block; margin-top:10px;}
  #score {font-size:20px; margin-top:10px;}
</style>
</head>
<body>
<div id="score">Score: 0</div>
<canvas id="gameCanvas" width="400" height="400"></canvas>
<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const grid = 20;
  let snake = [{x:100,y:100},{x:80,y:100},{x:60,y:100}];
  let dx = grid; let dy = 0;
  let food = {x:0,y:0};
  let score = 0;
  let changingDirection = false;

  function randomFood() {
    food.x = Math.floor(Math.random() * canvas.width / grid) * grid;
    food.y = Math.floor(Math.random() * canvas.height / grid) * grid;
  }

  function drawCell(x, y, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, grid - 1, grid - 1);
  }

  function clearCanvas() {
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function drawSnake() {
    snake.forEach(seg => drawCell(seg.x, seg.y, '#0f0'));
  }

  function drawFood() {
    drawCell(food.x, food.y, '#f00');
  }

  function moveSnake() {
    const head = {x: snake[0].x + dx, y: snake[0].y + dy};
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      document.getElementById('score').textContent = 'Score: ' + score;
      randomFood();
    } else {
      snake.pop();
    }
  }

  function changeDirection(event) {
    if (changingDirection) return;
    const key = event.keyCode;
    const LEFT = 37, UP = 38, RIGHT = 39, DOWN = 40;
    const goingLeft = dx === -grid;
    const goingRight = dx === grid;
    const goingUp = dy === -grid;
    const goingDown = dy === grid;
    if (key === LEFT && !goingRight) {dx = -grid; dy = 0;}
    else if (key === UP && !goingDown) {dx = 0; dy = -grid;}
    else if (key === RIGHT && !goingLeft) {dx = grid; dy = 0;}
    else if (key === DOWN && !goingUp) {dx = 0; dy = grid;}
    changingDirection = true;
  }

  function checkCollision() {
    const head = snake[0];
    // wall collision
    if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) return true;
    // self collision
    for (let i = 1; i < snake.length; i++) {
      if (head.x === snake[i].x && head.y === snake[i].y) return true;
    }
    return false;
  }

  function gameLoop() {
    if (checkCollision()) {
      alert('Game Over! Score: ' + score);
      document.location.reload();
      return;
    }
    changingDirection = false;
    clearCanvas();
    drawFood();
    moveSnake();
    drawSnake();
  }

  document.addEventListener('keydown', changeDirection);
  randomFood();
  setInterval(gameLoop, 100);
})();
</script>
</body>
</html>
