<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Country Autocomplete</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    margin: 2rem;
  }
  .autocomplete {
    position: relative;
    width: 300px;
  }
  input {
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
    font-size: 1rem;
  }
  .list {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    border: 1px solid #aaa;
    border-top: none;
    max-height: 180px;
    overflow-y: auto;
    background: #fff;
    display: none;
    z-index: 1000;
  }
  .list li {
    padding: 8px;
    cursor: pointer;
  }
  .list li.highlight {
    background: #007bff;
    color: #fff;
  }
</style>
</head>
<body>

<div class="autocomplete">
  <input type="text" id="countryInput" placeholder="Start typing a country..." autocomplete="off">
  <ul id="suggestions" class="list"></ul>
</div>

<script>
(() => {
  const countries = [
    "Afghanistan","Albania","Algeria","Andorra","Angola","Argentina","Armenia","Australia",
    "Austria","Azerbaijan","Bahamas","Bahrain","Bangladesh","Barbados","Belarus","Belgium",
    "Belize","Benin","Bhutan","Bolivia","Bosnia and Herzegovina","Botswana","Brazil","Brunei",
    "Bulgaria","Burkina Faso","Burundi","Cabo Verde","Cambodia","Cameroon","Canada","Central African Republic",
    "Chad","Chile","China","Colombia","Comoros","Congo (Congo-Brazzaville)","Costa Rica","Croatia",
    "Cuba","Cyprus","Czechia (Czech Republic)","Democratic Republic of the Congo","Denmark","Djibouti",
    "Dominica","Dominican Republic","Ecuador","Egypt","El Salvador","Equatorial Guinea","Eritrea","Estonia",
    "Eswatini (fmr. Swaziland)","Ethiopia","Fiji","Finland","France","Gabon","Gambia","Georgia","Germany",
    "Ghana","Greece","Grenada","Guatemala","Guinea","Guinea-Bissau","Guyana","Haiti","Holy See","Honduras",
    "Hungary","Iceland","India","Indonesia","Iran","Iraq","Ireland","Israel","Italy","Jamaica","Japan",
    "Jordan","Kazakhstan","Kenya","Kiribati","Kuwait","Kyrgyzstan","Laos","Latvia","Lebanon","Lesotho",
    "Liberia","Libya","Liechtenstein","Lithuania","Luxembourg","Madagascar","Malawi","Malaysia","Maldives",
    "Mali","Malta","Marshall Islands","Mauritania","Mauritius","Mexico","Micronesia","Moldova","Monaco",
    "Mongolia","Montenegro","Morocco","Mozambique","Myanmar (formerly Burma)","Namibia","Nauru","Nepal",
    "Netherlands","New Zealand","Nicaragua","Niger","Nigeria","North Korea","North Macedonia","Norway",
    "Oman","Pakistan","Palau","Palestine State","Panama","Papua New Guinea","Paraguay","Peru","Philippines",
    "Poland","Portugal","Qatar","Romania","Russia","Rwanda","Saint Kitts and Nevis","Saint Lucia",
    "Saint Vincent and the Grenadines","Samoa","San Marino","Sao Tome and Principe","Saudi Arabia","Senegal",
    "Serbia","Seychelles","Sierra Leone","Singapore","Slovakia","Slovenia","Solomon Islands","Somalia",
    "South Africa","South Korea","South Sudan","Spain","Sri Lanka","Sudan","Suriname","Sweden","Switzerland",
    "Syria","Tajikistan","Tanzania","Thailand","Timor-Leste","Togo","Tonga","Trinidad and Tobago","Tunisia",
    "Turkey","Turkmenistan","Tuvalu","Uganda","Ukraine","United Arab Emirates","United Kingdom","United States of America",
    "Uruguay","Uzbekistan","Vanuatu","Venezuela","Vietnam","Yemen","Zambia","Zimbabwe"
  ];

  const input = document.getElementById('countryInput');
  const list = document.getElementById('suggestions');
  let filtered = [];
  let highlightIdx = -1;

  const updateList = () => {
    const val = input.value.trim().toLowerCase();
    list.innerHTML = '';
    if (!val) {
      list.style.display = 'none';
      return;
    }
    filtered = countries.filter(c => c.toLowerCase().includes(val));
    if (filtered.length === 0) {
      list.style.display = 'none';
      return;
    }
    filtered.forEach((c, i) => {
      const li = document.createElement('li');
      li.textContent = c;
      li.addEventListener('mousedown', e => {
        // mousedown fires before blur, preventing loss of focus
        e.preventDefault();
        select(i);
      });
      list.appendChild(li);
    });
    highlightIdx = -1;
    list.style.display = 'block';
  };

  const highlight = idx => {
    const items = list.querySelectorAll('li');
    items.forEach((li, i) => li.classList.toggle('highlight', i === idx));
  };

  const select = idx => {
    if (idx >= 0 && idx < filtered.length) {
      input.value = filtered[idx];
      closeList();
    }
  };

  const closeList = () => {
    list.style.display = 'none';
    highlightIdx = -1;
  };

  input.addEventListener('input', updateList);
  input.addEventListener('keydown', e => {
    const items = list.querySelectorAll('li');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (items.length === 0) return;
      highlightIdx = (highlightIdx + 1) % items.length;
      highlight(highlightIdx);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (items.length === 0) return;
      highlightIdx = (highlightIdx - 1 + items.length) % items.length;
      highlight(highlightIdx);
    } else if (e.key === 'Enter') {
      if (highlightIdx >= 0) {
        e.preventDefault();
        select(highlightIdx);
      }
    } else if (e.key === 'Escape') {
      closeList();
    }
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.autocomplete')) {
      closeList();
    }
  });
})();
</script>

</body>
</html>
