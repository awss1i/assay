<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Canvas Zoom / Pan Demo</title>
<style>
  body {margin:0; font-family:sans-serif; background:#f0f0f0;}
  #toolbar {
    position:fixed; top:10px; left:10px; background:#fff;
    padding:8px 12px; border-radius:4px; box-shadow:0 2px 6px rgba(0,0,0,.2);
    display:flex; gap:8px; align-items:center;
  }
  #coords {min-width:120px;}
  canvas {display:block; background:#fff; margin:0; cursor:grab;}
  canvas:active {cursor:grabbing;}
</style>
</head>
<body>

<div id="toolbar">
  <button id="zoomIn">Zoom +</button>
  <button id="zoomOut">Zoom −</button>
  <span id="coords">x: 0, y: 0</span>
</div>

<canvas id="c"></canvas>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const zoomInBtn = document.getElementById('zoomIn');
  const zoomOutBtn = document.getElementById('zoomOut');
  const coordSpan = document.getElementById('coords');

  // ----- state ------------------------------------------------------------
  let scale = 1;                 // zoom factor
  let translate = {x: 0, y: 0};  // pan offset (world → screen)
  let isPanning = false;
  let startPan = {x: 0, y: 0};

  // ----- resize canvas to fill window ------------------------------------
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    draw(); // redraw after resize
  }
  window.addEventListener('resize', resize);
  resize();

  // ----- transform helpers -------------------------------------------------
  function screenToWorld(sx, sy) {
    // Apply inverse of current transform
    const wx = (sx - translate.x) / scale;
    const wy = (sy - translate.y) / scale;
    return {x: wx, y: wy};
  }

  // ----- drawing -----------------------------------------------------------
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(translate.x, translate.y);
    ctx.scale(scale, scale);

    // Example content: a grid of colored squares
    const gridSize = 50;
    const limit = 1000; // world coordinate limit
    for (let x = -limit; x <= limit; x += gridSize) {
      for (let y = -limit; y <= limit; y += gridSize) {
        ctx.fillStyle = ((x / gridSize + y / gridSize) % 2 === 0) ? '#4A90E2' : '#50E3C2';
        ctx.fillRect(x, y, gridSize, gridSize);
      }
    }

    // Draw axes
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2 / scale;
    ctx.beginPath();
    ctx.moveTo(-limit, 0);
    ctx.lineTo(limit, 0);
    ctx.moveTo(0, -limit);
    ctx.lineTo(0, limit);
    ctx.stroke();

    ctx.restore();
  }

  // ----- mouse handling ----------------------------------------------------
  canvas.addEventListener('mousedown', e => {
    isPanning = true;
    startPan = {x: e.clientX, y: e.clientY};
  });
  canvas.addEventListener('mousemove', e => {
    // update coordinate readout
    const world = screenToWorld(e.offsetX, e.offsetY);
    coordSpan.textContent = `x: ${world.x.toFixed(2)}, y: ${world.y.toFixed(2)}`;

    if (!isPanning) return;
    const dx = e.clientX - startPan.x;
    const dy = e.clientY - startPan.y;
    translate.x += dx;
    translate.y += dy;
    startPan = {x: e.clientX, y: e.clientY};
    draw();
  });
  canvas.addEventListener('mouseup', () => { isPanning = false; });
  canvas.addEventListener('mouseleave', () => { isPanning = false; });

  // ----- zoom buttons -------------------------------------------------------
  zoomInBtn.onclick = () => {
    const factor = 1.2;
    // Zoom towards the centre of the canvas
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const before = screenToWorld(cx, cy);
    scale *= factor;
    const after = screenToWorld(cx, cy);
    // Adjust pan so that the world point under the centre stays fixed
    translate.x += (after.x - before.x) * scale;
    translate.y += (after.y - before.y) * scale;
    draw();
  };
  zoomOutBtn.onclick = () => {
    const factor = 1 / 1.2;
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const before = screenToWorld(cx, cy);
    scale *= factor;
    const after = screenToWorld(cx, cy);
    translate.x += (after.x - before.x) * scale;
    translate.y += (after.y - before.y) * scale;
    draw();
  };

  // initial render
  draw();
})();
</script>
</body>
</html>
