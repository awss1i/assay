<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signature Pad</title>
<style>
  body {font-family: Arial, sans-serif; margin: 20px; display: flex; flex-direction: column; align-items: center;}
  canvas {border: 1px solid #ccc; touch-action: none;}
  .controls {margin-top: 10px;}
  button {margin: 0 5px; padding: 5px 10px; font-size: 14px;}
</style>
</head>
<body>
<h2>Signature Pad</h2>
<canvas id="pad" width="500" height="200"></canvas>
<div class="controls">
  <button id="clearBtn">Clear</button>
  <button id="undoBtn">Undo</button>
</div>
<script>
  (function(){
    const canvas = document.getElementById('pad');
    const ctx = canvas.getContext('2d');
    let drawing = false;
    let currentStroke = [];
    const strokes = [];

    function getPos(e){
      const rect = canvas.getBoundingClientRect();
      if(e.touches && e.touches.length){
        return {x:e.touches[0].clientX - rect.left, y:e.touches[0].clientY - rect.top};
      }
      return {x:e.clientX - rect.left, y:e.clientY - rect.top};
    }

    function start(e){
      e.preventDefault();
      drawing = true;
      currentStroke = [];
      const pos = getPos(e);
      currentStroke.push(pos);
    }

    function move(e){
      if(!drawing) return;
      e.preventDefault();
      const pos = getPos(e);
      currentStroke.push(pos);
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#000';
      ctx.beginPath();
      const prev = currentStroke[currentStroke.length-2];
      ctx.moveTo(prev.x, prev.y);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function end(e){
      if(!drawing) return;
      e.preventDefault();
      drawing = false;
      strokes.push(currentStroke);
    }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    canvas.addEventListener('mouseup', end);
    canvas.addEventListener('mouseleave', end);
    canvas.addEventListener('touchstart', start);
    canvas.addEventListener('touchmove', move);
    canvas.addEventListener('touchend', end);
    canvas.addEventListener('touchcancel', end);

    function redraw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#000';
      strokes.forEach(stroke => {
        for(let i=1;i<stroke.length;i++){
          ctx.beginPath();
          ctx.moveTo(stroke[i-1].x, stroke[i-1].y);
          ctx.lineTo(stroke[i].x, stroke[i].y);
          ctx.stroke();
        }
      });
    }

    document.getElementById('clearBtn').addEventListener('click',()=>{
      strokes.length = 0;
      ctx.clearRect(0,0,canvas.width,canvas.height);
    });

    document.getElementById('undoBtn').addEventListener('click',()=>{
      strokes.pop();
      redraw();
    });
  })();
</script>
</body>
</html>
