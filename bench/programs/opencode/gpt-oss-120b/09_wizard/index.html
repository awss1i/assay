<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signup Wizard</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
  }
  .wizard {
    background:#fff;
    padding:20px 30px;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    width:320px;
  }
  .progress {
    height:6px;
    background:#e0e0e0;
    border-radius:3px;
    overflow:hidden;
    margin-bottom:20px;
  }
  .progress .filled {
    height:100%;
    background:#4caf50;
    width:0%;
    transition:width .3s ease;
  }
  .step {
    display:none;
  }
  .step.active {
    display:block;
  }
  .nav {
    margin-top:20px;
    text-align:right;
  }
  button {
    background:#4caf50;
    color:#fff;
    border:none;
    padding:8px 16px;
    border-radius:4px;
    cursor:pointer;
    font-size:14px;
  }
  button:disabled {
    background:#9e9e9e;
    cursor:not-allowed;
  }
  button + button {
    margin-left:8px;
  }
  input {
    width:100%;
    padding:8px;
    margin-top:6px;
    margin-bottom:12px;
    border:1px solid #ccc;
    border-radius:4px;
    box-sizing:border-box;
  }
</style>
</head>
<body>

<div class="wizard">
  <div class="progress"><div class="filled"></div></div>

  <div class="step active" data-step="0">
    <h2>Account</h2>
    <label>
      Email
      <input type="email" id="email" required>
    </label>
    <label>
      Password
      <input type="password" id="password" required>
    </label>
  </div>

  <div class="step" data-step="1">
    <h2>Personal</h2>
    <label>
      First name
      <input type="text" id="firstName" required>
    </label>
    <label>
      Last name
      <input type="text" id="lastName" required>
    </label>
  </div>

  <div class="step" data-step="2">
    <h2>Confirm</h2>
    <p>Please review your information:</p>
    <pre id="summary" style="background:#fafafa;padding:10px;border:1px solid #ddd;"></pre>
  </div>

  <div class="nav">
    <button id="backBtn" disabled>Back</button>
    <button id="nextBtn">Next</button>
  </div>
</div>

<script>
  (function() {
    const steps = document.querySelectorAll('.step');
    const progressFilled = document.querySelector('.progress .filled');
    const backBtn = document.getElementById('backBtn');
    const nextBtn = document.getElementById('nextBtn');
    const summary = document.getElementById('summary');

    let current = 0;

    function updateUI() {
      // Show / hide steps
      steps.forEach((step, i) => {
        step.classList.toggle('active', i === current);
      });
      // Progress bar
      const percent = (current) / (steps.length - 1) * 100;
      progressFilled.style.width = percent + '%';
      // Buttons
      backBtn.disabled = current === 0;
      nextBtn.textContent = (current === steps.length - 1) ? 'Submit' : 'Next';
    }

    function collectData() {
      const data = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        firstName: document.getElementById('firstName').value,
        lastName: document.getElementById('lastName').value
      };
      return data;
    }

    function showSummary() {
      const data = collectData();
      summary.textContent = JSON.stringify(data, null, 2);
    }

    backBtn.addEventListener('click', () => {
      if (current > 0) {
        current--;
        updateUI();
      }
    });

    nextBtn.addEventListener('click', () => {
      // Simple validation: ensure required inputs in current step are filled
      const required = steps[current].querySelectorAll('input[required]');
      for (let inp of required) {
        if (!inp.value.trim()) {
          inp.focus();
          return;
        }
      }

      if (current < steps.length - 1) {
        current++;
        if (current === steps.length - 1) {
          showSummary();
        }
        updateUI();
      } else {
        // Final submit – just alert for demo purposes
        const data = collectData();
        alert('Submitted!\\n' + JSON.stringify(data, null, 2));
      }
    });

    // Initialise
    updateUI();
  })();
</script>

</body>
</html>
