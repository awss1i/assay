<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Month Calendar</title>
<style>
  body {font-family: Arial, sans-serif; margin:0; display:flex; justify-content:center; align-items:center; height:100vh; background:#f0f0f0;}
  .calendar {background:#fff; padding:20px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.2);}
  .header {display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .header button {background:#007BFF; color:#fff; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;}
  .header button:hover {background:#0056b3;}
  .header h2 {margin:0; font-size:1.5em;}
  table {border-collapse:collapse; width:100%;}
  th, td {width:14.28%; text-align:center; padding:8px;}
  th {background:#e9e9e9;}
  td {border:1px solid #ddd; height:40px;}
  .today {background:#ffeb3b;}
</style>
</head>
<body>
<div class="calendar">
  <div class="header">
    <button id="prev">&#9664; Prev</button>
    <h2 id="monthYear"></h2>
    <button id="next">Next &#9654;</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th>
      </tr>
    </thead>
    <tbody id="calendarBody">
    </tbody>
  </table>
</div>
<script>
(function(){
  const monthYearEl=document.getElementById('monthYear');
  const calendarBody=document.getElementById('calendarBody');
  const prevBtn=document.getElementById('prev');
  const nextBtn=document.getElementById('next');
  let today=new Date();
  let currentYear=today.getFullYear();
  let currentMonth=today.getMonth(); //0-indexed
  function render(year,month){
    monthYearEl.textContent=new Date(year,month).toLocaleString('default',{month:'long',year:'numeric'});
    calendarBody.innerHTML='';
    const firstDay=new Date(year,month,1).getDay(); //0=Sun
    const daysInMonth=new Date(year,month+1,0).getDate();
    let row=document.createElement('tr');
    // fill initial empty cells
    for(let i=0;i<firstDay;i++){
      const cell=document.createElement('td');
      row.appendChild(cell);
    }
    for(let day=1;day<=daysInMonth;day++){
      const cell=document.createElement('td');
      cell.textContent=day;
      if(year===today.getFullYear() && month===today.getMonth() && day===today.getDate()){
        cell.classList.add('today');
      }
      row.appendChild(cell);
      if((firstDay+day)%7===0){
        calendarBody.appendChild(row);
        row=document.createElement('tr');
      }
    }
    // fill trailing empty cells
    const remaining=(7 - (firstDay+daysInMonth)%7)%7;
    for(let i=0;i<remaining;i++){
      const cell=document.createElement('td');
      row.appendChild(cell);
    }
    calendarBody.appendChild(row);
  }
  prevBtn.addEventListener('click',()=>{
    currentMonth--;
    if(currentMonth<0){currentMonth=11; currentYear--;}
    render(currentYear,currentMonth);
  });
  nextBtn.addEventListener('click',()=>{
    currentMonth++;
    if(currentMonth>11){currentMonth=0; currentYear++;}
    render(currentYear,currentMonth);
  });
  render(currentYear,currentMonth);
})();
</script>
</body>
</html>
