<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Breakout</title>
<style>
  body{
    margin:0;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:#fff;
    font-family:sans-serif;
  }
  canvas{
    background:#000;
    border:2px solid #555;
  }
</style>
</head>
<body>
<canvas id="game" width="480" height="320"></canvas>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // Game constants
  const PADDLE_HEIGHT = 10;
  const PADDLE_WIDTH  = 75;
  const BALL_RADIUS   = 8;
  const ROW_COUNT     = 5;
  const COL_COUNT     = 7;
  const BRICK_WIDTH   = 55;
  const BRICK_HEIGHT  = 20;
  const BRICK_PADDING = 5;
  const BRICK_OFFSET_TOP = 30;
  const BRICK_OFFSET_LEFT = 30;

  // Game state
  const paddle = { x: (canvas.width - PADDLE_WIDTH) / 2 };
  const ball   = { x: canvas.width/2, y: canvas.height-30, dx: 2, dy: -2 };
  const bricks = [];

  let rightPressed = false;
  let leftPressed  = false;
  let score = 0;
  let lives = 3;

  // Initialise bricks
  for(let c = 0; c < COL_COUNT; c++) {
    bricks[c] = [];
    for(let r = 0; r < ROW_COUNT; r++) {
      bricks[c][r] = { x:0, y:0, status:1 }; // status 1 = visible
    }
  }

  // Input handling
  document.addEventListener('keydown', e => {
    if(e.key === 'ArrowRight') rightPressed = true;
    else if(e.key === 'ArrowLeft') leftPressed = true;
  });
  document.addEventListener('keyup', e => {
    if(e.key === 'ArrowRight') rightPressed = false;
    else if(e.key === 'ArrowLeft') leftPressed = false;
  });

  // Drawing helpers
  function drawPaddle(){
    ctx.beginPath();
    ctx.rect(paddle.x, canvas.height-PADDLE_HEIGHT, PADDLE_WIDTH, PADDLE_HEIGHT);
    ctx.fillStyle = '#0095DD';
    ctx.fill();
    ctx.closePath();
  }

  function drawBall(){
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI*2);
    ctx.fillStyle = '#FFDD00';
    ctx.fill();
    ctx.closePath();
  }

  function drawBricks(){
    for(let c = 0; c < COL_COUNT; c++){
      for(let r = 0; r < ROW_COUNT; r++){
        if(bricks[c][r].status){
          const brickX = (c*(BRICK_WIDTH+BRICK_PADDING))+BRICK_OFFSET_LEFT;
          const brickY = (r*(BRICK_HEIGHT+BRICK_PADDING))+BRICK_OFFSET_TOP;
          bricks[c][r].x = brickX;
          bricks[c][r].y = brickY;
          ctx.beginPath();
          ctx.rect(brickX, brickY, BRICK_WIDTH, BRICK_HEIGHT);
          ctx.fillStyle = '#'+((1<<24)*(Math.random()|0)).toString(16).padStart(6,'0');
          ctx.fill();
          ctx.closePath();
        }
      }
    }
  }

  function drawScore(){
    ctx.font = '16px Arial';
    ctx.fillStyle = '#fff';
    ctx.fillText('Score: '+score, 8, 20);
  }

  function drawLives(){
    ctx.font = '16px Arial';
    ctx.fillStyle = '#fff';
    ctx.fillText('Lives: '+lives, canvas.width-65, 20);
  }

  // Collision detection
  function collisionDetection(){
    for(let c = 0; c < COL_COUNT; c++){
      for(let r = 0; r < ROW_COUNT; r++){
        const b = bricks[c][r];
        if(b.status){
          if(ball.x > b.x && ball.x < b.x+BRICK_WIDTH &&
             ball.y > b.y && ball.y < b.y+BRICK_HEIGHT){
            ball.dy = -ball.dy;
            b.status = 0;
            score++;
            if(score === ROW_COUNT*COL_COUNT){
              alert('YOU WIN, CONGRATS!');
              document.location.reload();
            }
          }
        }
      }
    }
  }

  // Main draw loop
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawBricks();
    drawBall();
    drawPaddle();
    drawScore();
    drawLives();

    collisionDetection();

    // Ball movement
    ball.x += ball.dx;
    ball.y += ball.dy;

    // Wall collisions
    if(ball.x + ball.dx > canvas.width-BALL_RADIUS || ball.x + ball.dx < BALL_RADIUS){
      ball.dx = -ball.dx;
    }
    if(ball.y + ball.dy < BALL_RADIUS){
      ball.dy = -ball.dy;
    } else if(ball.y + ball.dy > canvas.height-BALL_RADIUS){
      if(ball.x > paddle.x && ball.x < paddle.x + PADDLE_WIDTH){
        ball.dy = -ball.dy;
        // Add a little spin based on where it hit the paddle
        const hitPos = (ball.x - (paddle.x + PADDLE_WIDTH/2)) / (PADDLE_WIDTH/2);
        ball.dx = ball.dx + hitPos;
      } else {
        lives--;
        if(!lives){
          alert('GAME OVER');
          document.location.reload();
        } else {
          // Reset ball & paddle
          ball.x = canvas.width/2;
          ball.y = canvas.height-30;
          ball.dx = 2;
          ball.dy = -2;
          paddle.x = (canvas.width - PADDLE_WIDTH) / 2;
        }
      }
    }

    // Paddle movement
    if(rightPressed && paddle.x < canvas.width - PADDLE_WIDTH){
      paddle.x += 7;
    } else if(leftPressed && paddle.x > 0){
      paddle.x -= 7;
    }

    requestAnimationFrame(draw);
  }

  // Start the game
  draw();
})();
</script>
</body>
</html>
