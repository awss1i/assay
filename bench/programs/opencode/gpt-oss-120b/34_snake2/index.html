<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
  body {margin:0;display:flex;flex-direction:column;align-items:center;background:#111;color:#eee;font-family:sans-serif;}
  canvas {background:#222;display:block;margin-top:1rem;}
  #info {margin-top:0.5rem;font-size:1.2rem;}
</style>
</head>
<body>
<h1>Snake</h1>
<canvas id="game" width="400" height="400"></canvas>
<div id="info">
  Score: <span id="score">0</span> |
  High Score: <span id="high">0</span>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const cellSize = 20;
  const cols = canvas.width / cellSize;
  const rows = canvas.height / cellSize;

  // Game state
  let snake = [{x: 5, y: 5}]; // initial head
  let dir = {x: 1, y: 0}; // moving right
  let food = randomCell();
  let score = 0;
  let highScore = parseInt(localStorage.getItem('snakeHigh')) || 0;
  let gameOver = false;
  const speed = 150; // ms per move

  // UI
  const scoreEl = document.getElementById('score');
  const highEl = document.getElementById('high');
  highEl.textContent = highScore;

  // Helpers
  function randomCell() {
    let cell;
    do {
      cell = {x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows)};
    } while (snake.some(s => s.x===cell.x && s.y===cell.y));
    return cell;
  }

  function drawCell({x, y}, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x*cellSize, y*cellSize, cellSize-1, cellSize-1);
  }

  function update() {
    if (gameOver) return;

    // Move snake head
    const newHead = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    // Wall collision
    if (newHead.x < 0 || newHead.x >= cols || newHead.y < 0 || newHead.y >= rows) {
      endGame();
      return;
    }

    // Self‑collision
    if (snake.some(s => s.x===newHead.x && s.y===newHead.y)) {
      endGame();
      return;
    }

    snake.unshift(newHead); // add new head

    // Eat food?
    if (newHead.x===food.x && newHead.y===food.y) {
      score++;
      scoreEl.textContent = score;
      if (score > highScore) {
        highScore = score;
        highEl.textContent = highScore;
        localStorage.setItem('snakeHigh', highScore);
      }
      food = randomCell();
    } else {
      snake.pop(); // remove tail
    }

    draw();
  }

  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // draw food
    drawCell(food, '#ff0');
    // draw snake
    snake.forEach((seg,i)=>drawCell(seg, i===0? '#0f0' : '#0a0'));
  }

  function endGame() {
    gameOver = true;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = '24px sans-serif';
    ctx.fillText('Game Over', canvas.width/2, canvas.height/2);
  }

  // Input handling
  window.addEventListener('keydown', e => {
    const key = e.key;
    if (key === 'ArrowUp' && dir.y !== 1) {dir = {x:0, y:-1};}
    else if (key === 'ArrowDown' && dir.y !== -1) {dir = {x:0, y:1};}
    else if (key === 'ArrowLeft' && dir.x !== 1) {dir = {x:-1, y:0};}
    else if (key === 'ArrowRight' && dir.x !== -1) {dir = {x:1, y:0};}
  });

  // Game loop
  setInterval(update, speed);
})();
</script>
</body>
</html>
