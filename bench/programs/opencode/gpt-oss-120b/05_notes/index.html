<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sticky Notes Board</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f0f0f0;
  }
  #controls {
    margin-bottom: 10px;
  }
  #addBtn {
    padding: 6px 12px;
    font-size: 14px;
    cursor: pointer;
  }
  #board {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .note {
    background: #fffb8f;
    width: 200px;
    min-height: 150px;
    padding: 8px;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .note textarea {
    flex: 1;
    border: none;
    resize: none;
    width: 100%;
    height: 100%;
    background: transparent;
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }
  .deleteBtn {
    position: absolute;
    top: 2px;
    right: 2px;
    background: #e74c3c;
    border: none;
    color: white;
    width: 20px;
    height: 20px;
    line-height: 18px;
    font-size: 14px;
    cursor: pointer;
    border-radius: 3px;
  }
</style>
</head>
<body>
<div id="controls">
  <button id="addBtn">Add Note</button>
</div>
<div id="board"></div>
<script>
  const board = document.getElementById('board');
  const addBtn = document.getElementById('addBtn');

  function createNote() {
    const note = document.createElement('div');
    note.className = 'note';

    const del = document.createElement('button');
    del.className = 'deleteBtn';
    del.textContent = '×';
    del.onclick = () => note.remove();
    note.appendChild(del);

    const textarea = document.createElement('textarea');
    textarea.placeholder = 'Write something...';
    note.appendChild(textarea);

    board.appendChild(note);
    textarea.focus();
  }

  addBtn.addEventListener('click', createNote);
</script>
</body>
</html>
