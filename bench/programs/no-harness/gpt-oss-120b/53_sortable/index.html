<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>People Table</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 2rem;
        background:#fafafa;
        color:#333;
    }
    h1 {
        text-align:center;
    }
    table {
        border-collapse: collapse;
        width: 90%;
        max-width: 800px;
        margin: 2rem auto;
        background:#fff;
        box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }
    th, td {
        border: 1px solid #bbb;
        padding: 0.6rem 1rem;
        text-align: left;
        cursor: pointer;
        user-select:none;
    }
    th {
        background:#f0f0f0;
    }
    th:hover {
        background:#e0e0e0;
    }
    th[data-order="asc"]::after {
        content:" ▲";
    }
    th[data-order="desc"]::after {
        content:" ▼";
    }
</style>
</head>
<body>
<h1>People</h1>
<table id="peopleTable">
    <thead>
        <tr>
            <th data-type="string">Name</th>
            <th data-type="number">Age</th>
            <th data-type="date">Joined</th>
        </tr>
    </thead>
    <tbody>
        <tr><td>Alice Johnson</td><td>34</td><td>2021-03-15</td></tr>
        <tr><td>Bob Smith</td><td>28</td><td>2019-07-22</td></tr>
        <tr><td>Carol Lee</td><td>45</td><td>2020-11-05</td></tr>
        <tr><td>David Kim</td><td>31</td><td>2018-02-14</td></tr>
        <tr><td>Eva Martinez</td><td>27</td><td>2022-01-09</td></tr>
        <tr><td>Frank O'Connor</td><td>52</td><td>2017-08-30</td></tr>
        <tr><td>Grace Patel</td><td>39</td><td>2020-06-18</td></tr>
        <tr><td>Henry Zhao</td><td>23</td><td>2023-04-01</td></tr>
    </tbody>
</table>

<script>
(function() {
    const table = document.getElementById('peopleTable');
    const tbody = table.tBodies[0];
    const headers = table.tHead.rows[0].cells;

    // Attach click listeners to each header cell
    for (let th of headers) {
        th.addEventListener('click', function () {
            const colIndex = this.cellIndex;
            const type = this.dataset.type;
            const currentOrder = this.dataset.order;
            const asc = currentOrder !== 'asc'; // toggle order

            // Convert rows to array for sorting
            const rowsArray = Array.from(tbody.rows);

            rowsArray.sort((rowA, rowB) => {
                let a = rowA.cells[colIndex].textContent.trim();
                let b = rowB.cells[colIndex].textContent.trim();

                let comparison = 0;
                if (type === 'number') {
                    comparison = Number(a) - Number(b);
                } else if (type === 'date') {
                    comparison = new Date(a) - new Date(b);
                } else {
                    // default string comparison, case‑insensitive
                    comparison = a.localeCompare(b, undefined, { sensitivity: 'base' });
                }
                return asc ? comparison : -comparison;
            });

            // Re‑append sorted rows
            tbody.append(...rowsArray);

            // Reset order indicators
            for (let h of headers) {
                h.dataset.order = '';
            }
            this.dataset.order = asc ? 'asc' : 'desc';
        });
    }
})();
</script>
</body>
</html>
