<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>6×6 Mini Spreadsheet</title>
<style>
  body {font-family:Arial,Helvetica,sans-serif; margin:20px;}
  table {border-collapse:collapse; user-select:none;}
  th, td {border:1px solid #777; width:80px; height:30px; text-align:center;}
  th {background:#f0f0f0;}
  input {
    width:100%; height:100%; box-sizing:border-box;
    border:none; padding:0 4px; text-align:center;
    font-size:14px; background:transparent;
  }
  input:focus {outline:none; background:#e8f0ff;}
</style>
</head>
<body>
<table id="sheet">
  <thead>
    <tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>F</th></tr>
  </thead>
  <tbody>
    <!-- rows will be generated by script -->
  </tbody>
</table>

<script>
(() => {
  const COLS = ['A','B','C','D','E','F'];
  const ROWS = 6;

  // cell data store
  const cells = {};

  const tableBody = document.querySelector('#sheet tbody');

  // create grid
  for (let r = 1; r <= ROWS; r++) {
    const tr = document.createElement('tr');
    const th = document.createElement('th');
    th.textContent = r;
    tr.appendChild(th);
    for (let c = 0; c < COLS.length; c++) {
      const id = COLS[c] + r;
      const td = document.createElement('td');
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.dataset.id = id;
      inp.addEventListener('focus', onFocus);
      inp.addEventListener('blur', onBlur);
      inp.addEventListener('input', onInput);
      td.appendChild(inp);
      tr.appendChild(td);
      // initialise cell object
      cells[id] = {
        id,
        element: inp,
        formula: null,      // string without leading =
        value: 0,           // numeric result
        dependents: new Set(),
        dependencies: new Set()
      };
    }
    tableBody.appendChild(tr);
  }

  // ----- Event handlers -----
  function onFocus(e) {
    const cell = cells[e.target.dataset.id];
    if (cell.formula !== null) e.target.value = '=' + cell.formula;
  }

  function onBlur(e) {
    const cell = cells[e.target.dataset.id];
    const txt = e.target.value.trim();
    if (txt.startsWith('=')) {
      const formula = txt.slice(1);
      setFormula(cell, formula);
    } else {
      clearFormula(cell);
      const num = parseFloat(txt);
      cell.value = isNaN(num) ? txt : num;
    }
    displayValue(cell);
    propagate(cell.id);
  }

  function onInput(e) {
    // live feedback not required
  }

  // ----- Core logic -----
  function clearFormula(cell) {
    // remove this cell from dependents of its old dependencies
    cell.dependencies.forEach(depId => cells[depId].dependents.delete(cell.id));
    cell.dependencies.clear();
    cell.formula = null;
  }

  function setFormula(cell, formula) {
    clearFormula(cell);
    // find referenced cells
    const refs = new Set();
    const refRegex = /\b([A-F][1-6])\b/g;
    let match;
    while ((match = refRegex.exec(formula)) !== null) {
      refs.add(match[1]);
    }
    // store deps
    cell.dependencies = refs;
    refs.forEach(depId => cells[depId].dependents.add(cell.id));
    cell.formula = formula;
    // evaluate now (detecting circular)
    try {
      cell.value = evaluate(cell.id, new Set());
    } catch (e) {
      cell.value = '#CIRC!';
    }
  }

  function evaluate(cellId, visited) {
    if (visited.has(cellId)) throw new Error('circular');
    visited.add(cellId);
    const cell = cells[cellId];
    if (cell.formula === null) {
      // raw value: treat non‑numeric as 0 for calculations
      const v = typeof cell.value === 'number' ? cell.value : parseFloat(cell.value);
      return isNaN(v) ? 0 : v;
    }
    // replace references with their evaluated values
    let expr = cell.formula.replace(/\b([A-F][1-6])\b/g, (_, ref) => {
      const val = evaluate(ref, visited);
      return typeof val === 'number' ? val : 0;
    });
    // safe evaluation
    let result;
    try {
      // eslint-disable-next-line no-new-func
      result = Function('"use strict";return (' + expr + ')')();
      if (typeof result !== 'number' || isNaN(result)) result = '#ERR!';
    } catch (e) {
      result = '#ERR!';
    }
    visited.delete(cellId);
    return result;
  }

  function displayValue(cell) {
    if (cell.formula !== null && typeof cell.value === 'number') {
      cell.element.value = cell.value;
    } else if (cell.formula !== null) {
      cell.element.value = cell.value; // #ERR! or #CIRC!
    } else {
      // raw entry: keep as typed (already set on blur)
    }
  }

  function propagate(startId) {
    const visited = new Set();
    const stack = [startId];
    while (stack.length) {
      const id = stack.pop();
      const cell = cells[id];
      cell.dependents.forEach(depId => {
        if (visited.has(depId)) return;
        visited.add(depId);
        try {
          cells[depId].value = evaluate(depId, new Set());
        } catch (e) {
          cells[depId].value = '#CIRC!';
        }
        displayValue(cells[depId]);
        stack.push(depId);
      });
    }
  }
})();
</script>
</body>
</html>
