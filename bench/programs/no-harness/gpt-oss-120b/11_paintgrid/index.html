<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>16×16 Pixel Painter</title>
<style>
    body{
        font-family:system-ui,Arial,sans-serif;
        background:#f5f5f5;
        margin:0;
        padding:20px;
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:20px;
    }
    #palette{
        display:flex;
        flex-wrap:wrap;
        gap:6px;
    }
    .swatch{
        width:30px;
        height:30px;
        border:2px solid #555;
        cursor:pointer;
    }
    .swatch.selected{
        outline:3px solid #000;
    }
    #grid{
        display:grid;
        grid-template-columns:repeat(16, 30px);
        grid-template-rows:repeat(16, 30px);
        gap:1px;
        background:#999;
    }
    .cell{
        width:30px;
        height:30px;
        background:#fff;
        cursor:pointer;
    }
    button{
        padding:6px 12px;
        font-size:16px;
        cursor:pointer;
    }
</style>
</head>
<body>

<h1>16×16 Pixel Painter</h1>

<div id="palette">
    <div class="swatch selected" data-color="#000000" style="background:#000000;"></div>
    <div class="swatch" data-color="#ff0000" style="background:#ff0000;"></div>
    <div class="swatch" data-color="#00ff00" style="background:#00ff00;"></div>
    <div class="swatch" data-color="#0000ff" style="background:#0000ff;"></div>
    <div class="swatch" data-color="#ffff00" style="background:#ffff00;"></div>
    <div class="swatch" data-color="#ff9900" style="background:#ff9900;"></div>
    <div class="swatch" data-color="#9900ff" style="background:#9900ff;"></div>
    <div class="swatch" data-color="#808080" style="background:#808080;"></div>
    <div class="swatch" data-color="#ffffff" style="background:#ffffff; border:2px solid #aaa;"></div>
</div>

<button id="clearBtn">Clear</button>

<div id="grid"></div>

<script>
(function(){
    const grid = document.getElementById('grid');
    const clearBtn = document.getElementById('clearBtn');
    const palette = document.getElementById('palette');
    let currentColor = '#000000'; // default black

    // build 16×16 cells
    for(let i = 0; i < 256; i++){
        const cell = document.createElement('div');
        cell.className = 'cell';
        grid.appendChild(cell);
    }

    // colour palette handling
    palette.addEventListener('click', e=>{
        if(e.target.classList.contains('swatch')){
            // remove previous selection
            const prev = palette.querySelector('.selected');
            if(prev) prev.classList.remove('selected');
            e.target.classList.add('selected');
            currentColor = e.target.dataset.color;
        }
    });

    // paint a cell
    grid.addEventListener('click', e=>{
        if(e.target.classList.contains('cell')){
            e.target.style.backgroundColor = currentColor;
        }
    });

    // optional: paint while mouse is held down
    let painting = false;
    grid.addEventListener('mousedown', e=>{
        if(e.target.classList.contains('cell')){
            painting = true;
            e.target.style.backgroundColor = currentColor;
        }
    });
    grid.addEventListener('mouseover', e=>{
        if(painting && e.target.classList.contains('cell')){
            e.target.style.backgroundColor = currentColor;
        }
    });
    document.addEventListener('mouseup',()=>{ painting = false; });

    // clear button
    clearBtn.addEventListener('click', ()=>{
        const cells = grid.querySelectorAll('.cell');
        cells.forEach(c=>c.style.backgroundColor = '');
    });
})();
</script>
</body>
</html>
