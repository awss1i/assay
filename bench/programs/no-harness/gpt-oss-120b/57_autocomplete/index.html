<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Country Autocomplete</title>
<style>
    body{
        font-family:system-ui,Arial,sans-serif;
        padding:2rem;
        background:#f7f7f7;
    }
    .autocomplete{
        position:relative;
        max-width:300px;
    }
    input{
        width:100%;
        padding:0.5rem 0.75rem;
        font-size:1rem;
        border:1px solid #aaa;
        border-radius:4px;
        box-sizing:border-box;
    }
    ul{
        position:absolute;
        top:100%;
        left:0;
        right:0;
        margin:0;
        padding:0;
        list-style:none;
        border:1px solid #aaa;
        border-top:none;
        background:#fff;
        max-height:200px;
        overflow-y:auto;
        z-index:1000;
    }
    li{
        padding:0.5rem 0.75rem;
        cursor:pointer;
    }
    li:hover,
    li.active{
        background:#3399ff;
        color:#fff;
    }
    li.hidden{
        display:none;
    }
</style>
</head>
<body>

<div class="autocomplete">
    <input type="text" id="country-input" placeholder="Type a country…" autocomplete="off">
    <ul id="suggestion-list" hidden></ul>
</div>

<script>
(() => {
    const countries = [
        "Afghanistan","Albania","Algeria","Andorra","Angola","Antigua and Barbuda","Argentina","Armenia",
        "Australia","Austria","Azerbaijan","Bahamas","Bahrain","Bangladesh","Barbados","Belarus","Belgium",
        "Belize","Benin","Bhutan","Bolivia","Bosnia and Herzegovina","Botswana","Brazil","Brunei","Bulgaria",
        "Burkina Faso","Burundi","Cabo Verde","Cambodia","Cameroon","Canada","Central African Republic","Chad",
        "Chile","China","Colombia","Comoros","Congo (Congo‑Berkeley)","Costa Rica","Croatia","Cuba","Cyprus",
        "Czechia (Czech Republic)","Democratic Republic of the Congo","Denmark","Djibouti","Dominica",
        "Dominican Republic","Ecuador","Egypt","El Salvador","Equatorial Guinea","Eritrea","Estonia","Eswatini",
        "Ethiopia","Fiji","Finland","France","Gabon","Gambia","Georgia","Germany","Ghana","Greece","Grenada",
        "Guatemala","Guinea","Guinea‑Bissau","Guyana","Haiti","Holy See","Honduras","Hungary","Iceland","India",
        "Indonesia","Iran","Iraq","Ireland","Israel","Italy","Jamaica","Japan","Jordan","Kazakhstan","Kenya",
        "Kiribati","Kuwait","Kyrgyzstan","Laos","Latvia","Lebanon","Lesotho","Liberia","Libya","Liechtenstein",
        "Lithuania","Luxembourg","Madagascar","Malawi","Malaysia","Maldives","Mali","Malta","Marshall Islands",
        "Mauritania","Mauritius","Mexico","Micronesia","Moldova","Monaco","Mongolia","Montenegro","Morocco",
        "Mozambique","Myanmar (Burma)","Namibia","Nauru","Nepal","Netherlands","New Zealand","Nicaragua","Niger",
        "Nigeria","North Korea","North Macedonia","Norway","Oman","Pakistan","Palau","Palestine State","Panama",
        "Papua New Guinea","Paraguay","Peru","Philippines","Poland","Portugal","Qatar","Romania","Russia","Rwanda",
        "Saint Kitts and Nevis","Saint Lucia","Saint Vincent and the Grenadines","Samoa","San Marino","Sao Tome and Principe",
        "Saudi Arabia","Senegal","Serbia","Seychelles","Sierra Leone","Singapore","Slovakia","Slovenia","Solomon Islands",
        "Somalia","South Africa","South Korea","South Sudan","Spain","Sri Lanka","Sudan","Suriname","Sweden",
        "Switzerland","Syria","Tajikistan","Tanzania","Thailand","Timor‑Leste","Togo","Tonga","Trinidad and Tobago",
        "Tunisia","Turkey","Turkmenistan","Tuvalu","Uganda","Ukraine","United Arab Emirates","United Kingdom",
        "United States of America","Uruguay","Uzbekistan","Vanuatu","Venezuela","Vietnam","Yemen","Zambia","Zimbabwe"
    ];

    const input = document.getElementById('country-input');
    const list  = document.getElementById('suggestion-list');
    let activeIdx = -1; // index of highlighted suggestion

    const renderList = (matches) => {
        list.innerHTML = '';
        matches.forEach((c,i) => {
            const li = document.createElement('li');
            li.textContent = c;
            li.dataset.index = i;
            li.addEventListener('mousedown', e => {
                // mousedown to fire before blur
                e.preventDefault();
                selectSuggestion(i);
            });
            list.appendChild(li);
        });
        if (matches.length) {
            list.hidden = false;
        } else {
            list.hidden = true;
        }
        activeIdx = -1;
    };

    const filterCountries = () => {
        const val = input.value.trim().toLowerCase();
        if (!val) {
            list.hidden = true;
            return;
        }
        const matches = countries.filter(c => c.toLowerCase().includes(val));
        renderList(matches);
    };

    const highlight = (idx) => {
        const items = list.querySelectorAll('li');
        items.forEach(li => li.classList.remove('active'));
        if (idx >= 0 && idx < items.length) {
            items[idx].classList.add('active');
            activeIdx = idx;
        } else {
            activeIdx = -1;
        }
    };

    const selectSuggestion = (idx) => {
        const items = list.querySelectorAll('li');
        if (idx >=0 && idx < items.length) {
            input.value = items[idx].textContent;
            closeList();
        }
    };

    const closeList = () => {
        list.hidden = true;
        activeIdx = -1;
    };

    input.addEventListener('input', filterCountries);

    input.addEventListener('keydown', e => {
        const items = list.querySelectorAll('li');
        if (list.hidden) return; // nothing to navigate

        switch(e.key) {
            case 'ArrowDown':
                e.preventDefault();
                if (activeIdx < items.length-1) {
                    highlight(activeIdx+1);
                } else {
                    highlight(0);
                }
                break;
            case 'ArrowUp':
                e.preventDefault();
                if (activeIdx > 0) {
                    highlight(activeIdx-1);
                } else {
                    highlight(items.length-1);
                }
                break;
            case 'Enter':
                e.preventDefault();
                if (activeIdx >= 0) {
                    selectSuggestion(activeIdx);
                }
                break;
            case 'Escape':
                e.preventDefault();
                closeList();
                break;
        }
    });

    // close the suggestion list when clicking outside
    document.addEventListener('click', e => {
        if (!e.target.closest('.autocomplete')) {
            closeList();
        }
    });
})();
</script>

</body>
</html>
