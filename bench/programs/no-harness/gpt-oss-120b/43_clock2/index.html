<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>World Clock</title>
<style>
    body {
        margin: 0;
        padding: 20px;
        font-family: Arial, Helvetica, sans-serif;
        background: #f0f4f8;
        color: #333;
    }
    h1 {
        text-align: center;
        margin-bottom: 10px;
    }
    .toggle {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 20px;
        gap: 8px;
    }
    .clocks {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
    }
    .clock {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        padding: 15px 20px;
        min-width: 180px;
        text-align: center;
    }
    .city {
        font-weight: bold;
        margin-bottom: 5px;
        font-size: 1.1rem;
    }
    .time {
        font-family: monospace;
        font-size: 1.6rem;
        letter-spacing: 0.5px;
    }
    /* Simple toggle switch */
    .switch {
        position: relative;
        display: inline-block;
        width: 52px;
        height: 28px;
    }
    .switch input {
        opacity: 0;
        width: 0;
        height: 0;
    }
    .slider {
        position: absolute;
        cursor: pointer;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: #ccc;
        transition: .25s;
        border-radius: 28px;
    }
    .slider:before {
        position: absolute;
        content: "";
        height: 22px; width: 22px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: .25s;
        border-radius: 50%;
    }
    input:checked + .slider {
        background-color: #66bb6a;
    }
    input:checked + .slider:before {
        transform: translateX(24px);
    }
</style>
</head>
<body>
<h1>World Clock</h1>

<div class="toggle">
    <label for="formatToggle">24‑hour format</label>
    <label class="switch">
        <input type="checkbox" id="formatToggle">
        <span class="slider"></span>
    </label>
</div>

<div class="clocks" id="clocksContainer">
    <!-- Clock cards will be generated by JavaScript -->
</div>

<script>
    // ---- Configuration -------------------------------------------------
    const cities = [
        { name: "New York",   tz: "America/New_York" },
        { name: "London",    tz: "Europe/London" },
        { name: "Tokyo",     tz: "Asia/Tokyo" },
        { name: "Sydney",    tz: "Australia/Sydney" }
    ];

    // ---- DOM creation --------------------------------------------------
    const container = document.getElementById('clocksContainer');

    cities.forEach(city => {
        const card = document.createElement('div');
        card.className = 'clock';
        card.dataset.timezone = city.tz;               // store tz for later use

        const cityEl = document.createElement('div');
        cityEl.className = 'city';
        cityEl.textContent = city.name;

        const timeEl = document.createElement('div');
        timeEl.className = 'time';
        timeEl.textContent = '--:--:--';

        card.appendChild(cityEl);
        card.appendChild(timeEl);
        container.appendChild(card);
    });

    // ---- Time updating -------------------------------------------------
    let use24Hour = false; // default 12‑hour

    function updateClocks() {
        const formatOptions = {
            hour:   'numeric',
            minute: '2-digit',
            second: '2-digit',
            hour12: !use24Hour,
            timeZone: '' // will be set per city
        };

        document.querySelectorAll('.clock').forEach(clock => {
            const tz = clock.dataset.timezone;
            const timeEl = clock.querySelector('.time');

            formatOptions.timeZone = tz;
            const formatter = new Intl.DateTimeFormat([], formatOptions);
            const now = new Date();
            timeEl.textContent = formatter.format(now);
        });
    }

    // ---- Toggle handling ------------------------------------------------
    const toggle = document.getElementById('formatToggle');
    toggle.addEventListener('change', () => {
        use24Hour = toggle.checked;
        updateClocks(); // immediate update on toggle
    });

    // ---- Start ticking -------------------------------------------------
    updateClocks();               // initial render
    setInterval(updateClocks, 1000);
</script>
</body>
</html>
