<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tabbed Panels</title>
  <style>
    body {font-family: Arial, sans-serif; margin: 20px;}
    .tabs {display: flex; list-style: none; padding: 0; margin: 0 0 10px 0; border-bottom: 2px solid #ccc;}
    .tabs li {padding: 8px 16px; cursor: pointer; border: 1px solid #ccc; border-bottom: none; margin-right: 2px; background: #f0f0f0;}
    .tabs li.active {background: #fff; font-weight: bold;}
    .panel {display: none; border: 1px solid #ccc; padding: 20px;}
    .panel.active {display: block;}
  </style>
</head>
<body>
  <ul class="tabs" role="tablist">
    <li role="tab" data-index="0" tabindex="0" class="active">Tab 1</li>
    <li role="tab" data-index="1" tabindex="-1">Tab 2</li>
    <li role="tab" data-index="2" tabindex="-1">Tab 3</li>
    <li role="tab" data-index="3" tabindex="-1">Tab 4</li>
  </ul>
  <div class="panels">
    <div class="panel active" role="tabpanel">Content for Panel 1</div>
    <div class="panel" role="tabpanel">Content for Panel 2</div>
    <div class="panel" role="tabpanel">Content for Panel 3</div>
    <div class="panel" role="tabpanel">Content for Panel 4</div>
  </div>
  <script>
    (function(){
      const tabs = document.querySelectorAll('.tabs li');
      const panels = document.querySelectorAll('.panel');
      const activateTab = (index) => {
        tabs.forEach((t,i)=>{
          const isActive = i===index;
          t.classList.toggle('active', isActive);
          t.setAttribute('tabindex', isActive? '0' : '-1');
          if(isActive) t.focus();
        });
        panels.forEach((p,i)=>{
          p.classList.toggle('active', i===index);
        });
      };
      tabs.forEach(tab=>{
        tab.addEventListener('click',()=>{
          const idx = Number(tab.dataset.index);
          activateTab(idx);
        });
        tab.addEventListener('keydown', (e)=>{
          const cur = Number(tab.dataset.index);
          let newIdx;
          if(e.key==='ArrowRight') newIdx = (cur+1)%tabs.length;
          else if(e.key==='ArrowLeft') newIdx = (cur-1+tabs.length)%tabs.length;
          else if(e.key==='Home') newIdx = 0;
          else if(e.key==='End') newIdx = tabs.length-1;
          else return;
          e.preventDefault();
          activateTab(newIdx);
        });
      });
      // Global keyboard shortcuts when focus is not on a tab
      document.addEventListener('keydown', (e)=>{
        const activeIdx = Array.from(tabs).findIndex(t=>t.classList.contains('active'));
        if(document.activeElement===document.body) {
          let newIdx;
          if(e.key==='ArrowRight') newIdx = (activeIdx+1)%tabs.length;
          else if(e.key==='ArrowLeft') newIdx = (activeIdx-1+tabs.length)%tabs.length;
          else if(e.key==='Home') newIdx = 0;
          else if(e.key==='End') newIdx = tabs.length-1;
          else return;
          e.preventDefault();
          activateTab(newIdx);
        }
      });
    })();
  </script>
</body>
</html>
