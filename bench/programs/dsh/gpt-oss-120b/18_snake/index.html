<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
  body {margin:0; display:flex; justify-content:center; align-items:center; height:100vh; background:#111; color:#fff; font-family:Arial, sans-serif;}
  #game {border:2px solid #fff; background:#000;}
  #score {position:absolute; top:10px; left:10px; font-size:20px;}
</style>
</head>
<body>
<div id="score">Score: 0</div>
<canvas id="game" width="400" height="400"></canvas>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const gridSize = 20; // size of each cell
  const cols = canvas.width / gridSize;
  const rows = canvas.height / gridSize;

  let snake = [{x: 5, y: 5}]; // initial snake
  let direction = {x: 1, y: 0}; // moving right initially
  let food = randomFood();
  let score = 0;
  let gameInterval;

  function randomFood() {
    let f;
    do {
      f = {x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows)};
    } while (snake.some(s => s.x===f.x && s.y===f.y));
    return f;
  }

  function drawCell(x, y, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x*gridSize, y*gridSize, gridSize-1, gridSize-1);
  }

  function update() {
    // move snake
    const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

    // wrap around edges
    if (head.x < 0) head.x = cols-1;
    if (head.x >= cols) head.x = 0;
    if (head.y < 0) head.y = rows-1;
    if (head.y >= rows) head.y = 0;

    // check collision with self
    if (snake.some(seg => seg.x===head.x && seg.y===head.y)) {
      clearInterval(gameInterval);
      alert('Game Over! Final score: ' + score);
      return;
    }

    snake.unshift(head);
    // check food
    if (head.x===food.x && head.y===food.y) {
      score++;
      document.getElementById('score').textContent = 'Score: ' + score;
      food = randomFood();
    } else {
      snake.pop(); // remove tail
    }
    draw();
  }

  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // draw food
    drawCell(food.x, food.y, 'red');
    // draw snake
    snake.forEach((seg,i)=>drawCell(seg.x, seg.y, i===0? 'lime' : 'green'));
  }

  document.addEventListener('keydown', e => {
    const key = e.key;
    if (key === 'ArrowUp' && direction.y !== 1) direction = {x:0, y:-1};
    else if (key === 'ArrowDown' && direction.y !== -1) direction = {x:0, y:1};
    else if (key === 'ArrowLeft' && direction.x !== 1) direction = {x:-1, y:0};
    else if (key === 'ArrowRight' && direction.x !== -1) direction = {x:1, y:0};
  });

  // start game loop
  gameInterval = setInterval(update, 100);
})();
</script>
</body>
</html>
