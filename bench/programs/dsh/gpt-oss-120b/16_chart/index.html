<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bar Chart</title>
<style>
body {font-family: Arial, sans-serif; padding:20px;}
#input {width:300px;}
#addBtn {margin-left:5px;}
canvas {border:1px solid #ccc; margin-top:10px;}
</style>
</head>
<body>
<h2>Bar Chart</h2>
<input id="input" type="number" placeholder="Enter a number">
<button id="addBtn">Add</button>
<canvas id="chart" width="600" height="400"></canvas>
<script>
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
let data = [];

function drawChart() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(data.length===0) return;
  const padding = 40;
  const width = canvas.width - padding*2;
  const height = canvas.height - padding*2;
  const maxVal = Math.max(...data);
  const barWidth = width / data.length * 0.8;
  const gap = width / data.length * 0.2;
  ctx.fillStyle = '#333';
  ctx.textAlign = 'center';
  // y axis labels
  ctx.beginPath();
  for(let i=0;i<=5;i++){
    const y = padding + height - i*height/5;
    const val = Math.round(maxVal*i/5);
    ctx.moveTo(padding-5,y);
    ctx.lineTo(padding,y);
    ctx.fillText(val, padding-15, y+3);
  }
  ctx.stroke();
  // bars
  data.forEach((v,i)=>{
    const barHeight = v/maxVal * height;
    const x = padding + i*(barWidth+gap) + gap/2;
    const y = padding + height - barHeight;
    ctx.fillStyle = '#4caf50';
    ctx.fillRect(x,y,barWidth,barHeight);
    ctx.fillStyle = '#000';
    ctx.fillText(v, x+barWidth/2, y-5);
  });
}

document.getElementById('addBtn').addEventListener('click',()=>{
  const val = parseFloat(document.getElementById('input').value);
  if(!isNaN(val)){
    data.push(val);
    drawChart();
    document.getElementById('input').value='';
  }
});
</script>
</body>
</html>
