<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
  body {font-family: sans-serif; display:flex; flex-direction:column; align-items:center; background:#222; color:#eee; height:100vh; margin:0;}
  #game {border:2px solid #555; background:#111;}
  #scoreboard {margin:10px; font-size:1.2em;}
  #msg {margin-top:10px; font-size:1.2em; color:#ff6;}
</style>
</head>
<body>
<div id="scoreboard">
  Score: <span id="score">0</span> | High Score: <span id="highScore">0</span>
</div>
<canvas id="game" width="400" height="400"></canvas>
<div id="msg"></div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const cellSize = 20;
  const cols = canvas.width / cellSize;
  const rows = canvas.height / cellSize;

  let snake = [{x: 5, y: 5}];
  let direction = {x: 1, y: 0};
  let food = null;
  let score = 0;
  let highScore = parseInt(localStorage.getItem('snakeHighScore')||'0',10);
  let gameInterval = null;

  const scoreEl = document.getElementById('score');
  const highScoreEl = document.getElementById('highScore');
  const msgEl = document.getElementById('msg');
  highScoreEl.textContent = highScore;

  function placeFood() {
    let pos;
    do {
      pos = {x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows)};
    } while (snake.some(seg=> seg.x===pos.x && seg.y===pos.y));
    food = pos;
  }

  function drawCell(x,y,color){
    ctx.fillStyle = color;
    ctx.fillRect(x*cellSize, y*cellSize, cellSize-1, cellSize-1);
  }

  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // draw food
    drawCell(food.x, food.y, '#e33');
    // draw snake
    snake.forEach((seg,i)=> drawCell(seg.x, seg.y, i===0 ? '#0f0' : '#0a0'));
  }

  function update() {
    const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};
    // wall collision
    if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
      endGame();
      return;
    }
    // self collision
    if (snake.some(seg=> seg.x===head.x && seg.y===head.y)) {
      endGame();
      return;
    }
    snake.unshift(head);
    // eat food
    if (head.x===food.x && head.y===food.y) {
      score++;
      scoreEl.textContent = score;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('snakeHighScore', highScore);
        highScoreEl.textContent = highScore;
      }
      placeFood();
    } else {
      snake.pop(); // move without growing
    }
    draw();
  }

  function endGame() {
    clearInterval(gameInterval);
    msgEl.textContent = 'Game Over! Press Space to restart.';
  }

  function startGame() {
    snake = [{x: 5, y:5}];
    direction = {x:1, y:0};
    score = 0;
    scoreEl.textContent = score;
    msgEl.textContent = '';
    placeFood();
    draw();
    if (gameInterval) clearInterval(gameInterval);
    gameInterval = setInterval(update, 120);
  }

  // key handling
  document.addEventListener('keydown', e=> {
    const key = e.key;
    if (key === 'ArrowUp' && direction.y !== 1) {direction = {x:0, y:-1};}
    else if (key === 'ArrowDown' && direction.y !== -1) {direction = {x:0, y:1};}
    else if (key === 'ArrowLeft' && direction.x !== 1) {direction = {x:-1, y:0};}
    else if (key === 'ArrowRight' && direction.x !== -1) {direction = {x:1, y:0};}
    else if (key === ' ' && !gameInterval) {
      startGame();
    }
  });

  // start automatically
  startGame();
})();
</script>
</body>
</html>
