<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up</title>
<style>
  body {font-family: Arial, sans-serif; background:#f0f0f0; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;}
  .container {background:#fff; padding:20px 30px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.1); width:300px;}
  h2 {margin-top:0; text-align:center;}
  .field {margin-bottom:15px;}
  label {display:block; margin-bottom:5px; font-weight:bold;}
  input {width:100%; padding:8px; box-sizing:border-box; border:1px solid #ccc; border-radius:4px;}
  .error {color:#d00; font-size:0.9em; height:1em; margin-top:4px;}
  .success {color:#080; text-align:center; margin-top:15px; font-weight:bold;}
  button {width:100%; padding:10px; background:#28a745; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:1em;}
  button:hover {background:#218838;}
</style>
</head>
<body>
<div class="container">
  <h2>Sign Up</h2>
  <form id="signupForm" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />
      <div class="error" id="emailError"></div>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="6" />
      <div class="error" id="passwordError"></div>
    </div>
    <button type="submit">Sign Up</button>
    <div class="success" id="successMessage" style="display:none;">✅ Sign‑up successful!</div>
  </form>
</div>
<script>
document.getElementById('signupForm').addEventListener('submit', function(e){
  e.preventDefault();
  // Clear previous errors
  document.getElementById('emailError').textContent = '';
  document.getElementById('passwordError').textContent = '';
  document.getElementById('successMessage').style.display = 'none';
  let valid = true;
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  // Simple email regex
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if(!emailRegex.test(email)){
    document.getElementById('emailError').textContent = 'Please enter a valid email.';
    valid = false;
  }
  if(password.length < 6){
    document.getElementById('passwordError').textContent = 'Password must be at least 6 characters.';
    valid = false;
  }
  if(valid){
    document.getElementById('successMessage').style.display = 'block';
    // Optionally clear fields
    // document.getElementById('signupForm').reset();
  }
});
</script>
</body>
</html>
