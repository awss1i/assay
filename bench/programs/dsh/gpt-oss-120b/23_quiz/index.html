<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quiz</title>
  <style>
    body {font-family: Arial, sans-serif; max-width: 600px; margin: 2rem auto; line-height: 1.5;}
    h1 {text-align: center;}
    .question {margin-bottom: 1.5rem;}
    .choices label {display: block; margin: 0.2rem 0;}
    #result {font-weight: bold; margin-top: 1.5rem;}
    button {padding: 0.5rem 1rem; font-size: 1rem;}
  </style>
</head>
<body>
  <h1>Five‑Question Quiz</h1>
  <form id="quizForm">
    <div class="question" id="q1">
      <p>1. What is the capital of France?</p>
      <div class="choices">
        <label><input type="radio" name="q1" value="0"> Berlin</label>
        <label><input type="radio" name="q1" value="1"> Madrid</label>
        <label><input type="radio" name="q1" value="2"> Paris</label>
        <label><input type="radio" name="q1" value="3"> Rome</label>
      </div>
    </div>
    <div class="question" id="q2">
      <p>2. Which element has chemical symbol "O"?</p>
      <div class="choices">
        <label><input type="radio" name="q2" value="0"> Gold</label>
        <label><input type="radio" name="q2" value="1"> Oxygen</label>
        <label><input type="radio" name="q2" value="2"> Silver</label>
        <label><input type="radio" name="q2" value="3"> Iron</label>
      </div>
    </div>
    <div class="question" id="q3">
      <p>3. Which planet is known as the Red Planet?</p>
      <div class="choices">
        <label><input type="radio" name="q3" value="0"> Earth</label>
        <label><input type="radio" name="q3" value="1"> Venus</label>
        <label><input type="radio" name="q3" value="2"> Mars</label>
        <label><input type="radio" name="q3" value="3"> Jupiter</label>
      </div>
    </div>
    <div class="question" id="q4">
      <p>4. Who wrote "Hamlet"?</p>
      <div class="choices">
        <label><input type="radio" name="q4" value="0"> Charles Dickens</label>
        <label><input type="radio" name="q4" value="1"> William Shakespeare</label>
        <label><input type="radio" name="q4" value="2"> Mark Twain</label>
        <label><input type="radio" name="q4" value="3"> Jane Austen</label>
      </div>
    </div>
    <div class="question" id="q5">
      <p>5. What is 7 × 6?</p>
      <div class="choices">
        <label><input type="radio" name="q5" value="0"> 42</label>
        <label><input type="radio" name="q5" value="1"> 36</label>
        <label><input type="radio" name="q5" value="2"> 48</label>
        <label><input type="radio" name="q5" value="3"> 54</label>
      </div>
    </div>
    <button type="button" onclick="showResult()">Submit</button>
  </form>
  <div id="result"></div>

  <script>
    const correctAnswers = {
      q1: "2",
      q2: "1",
      q3: "2",
      q4: "1",
      q5: "0"
    };
    function showResult() {
      let score = 0;
      const total = Object.keys(correctAnswers).length;
      for (const [q, ans] of Object.entries(correctAnswers)) {
        const selected = document.querySelector(`input[name="${q}"]:checked`);
        if (selected && selected.value === ans) score++;
      }
      const resultDiv = document.getElementById('result');
      resultDiv.textContent = `You scored ${score} out of ${total}`;
    }
  </script>
</body>
</html>
