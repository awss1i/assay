name: spelling

# Checks spelling across the repository and every link in the docs.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  spelling:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2
        with:
          config: .github/typos.toml

  links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # A link to this repository's main branch is checked against the
          # files in this checkout, so a pull request can link to a page it
          # adds. The rules are in single quotes because the action passes
          # its arguments through the shell, which would expand $1 and $2.
          args: >-
            --config .github/lychee.toml
            --remap '^https://github\.com/awss1i/assay/(blob|tree)/main/(.*)$ file://${{ github.workspace }}/$2'
            --remap '^https://raw\.githubusercontent\.com/awss1i/assay/main/(.*)$ file://${{ github.workspace }}/$1'
            '**/*.md'
