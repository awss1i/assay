name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      # The end-to-end tests drive a real page. Without this they skip rather
      # than fail, which would make a green tick mean much less than it looks.
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q

  benchmark-still-runs:
    # The tests prove the tool works. They do not prove the *benchmark* can
    # still be reproduced: `bench/score.py` calls into assay, so a rename
    # inside the tool can break it while every test stays green, and the
    # first person to find out would be a stranger who took us up on the
    # invitation to check our numbers. This runs a few programs through the
    # real scorers. They write nothing; they only have to still work.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e "."
      - run: python -m playwright install --with-deps chromium
      - run: python bench/score.py --limit 3
      - run: python bench/planted/score.py --limit 2
