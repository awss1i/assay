name: labeler

# Uses `pull_request_target` so it can label pull requests from forks. It
# reads only the list of changed files and never checks out the pull
# request's code, so no code from a fork runs with this token.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]

permissions: {}

jobs:
  label:
    # Dependabot labels its own pull requests.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          # A later push can move a pull request into or out of an area.
          sync-labels: true
