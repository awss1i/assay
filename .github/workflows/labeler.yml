name: labeler

# `pull_request_target` so it can label pull requests from forks. It reads
# only the list of changed files and never checks out the pull request's
# code, so nothing from a fork runs with this token.
on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
