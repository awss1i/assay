name: False alarm
description: A page that works, and assay flagged it.
labels: [false alarm]
body:
  - type: markdown
    attributes:
      value: |
        A false alarm is the most costly mistake assay can make, because it sends someone to change code that was right, so a report of one is the most useful issue you can file. The page is required, because without it the false alarm can't be reproduced or fixed.
  - type: textarea
    id: page
    attributes:
      label: The page
      description: Attach the HTML or a zip of the folder, or link a repository holding it.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: Exactly what you ran.
      placeholder: assay ./my-app
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What assay printed
      description: At least the case it flagged and the reason under it.
      render: console
    validations:
      required: true
  - type: textarea
    id: right
    attributes:
      label: Why the page is right
      description: What the flagged control is meant to do, and why what assay saw is correct behaviour.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: assay version
      description: The output of `assay --version`.
    validations:
      required: true
