name: Bug
description: Something is wrong
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: How to reproduce
      description: The smallest steps or code that show it.
    validations:
      required: true
  - type: input
    attributes:
      label: Version
